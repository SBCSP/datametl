apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datametl.fullname" . }}-worker
  labels:
    {{- include "datametl.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "datametl.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "datametl.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "datametl.serviceAccountName" . }}
      {{- include "datametl.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.migrations.enabled }}
        {{- include "datametl.initWaitSchema" . | nindent 8 }}
        {{- else }}
        {{- include "datametl.initWaitDb" . | nindent 8 }}
        {{- end }}
      containers:
        - name: worker
          image: {{ include "datametl.image" (list . .Values.worker.repo .Values.worker.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["arq", "app.jobs.worker.WorkerSettings"]
          env:
            {{- include "datametl.appEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
