{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datametl.fullname" . }}-secrets
  labels:
    {{- include "datametl.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required when secrets.existingSecret is unset (generate with: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\")" .Values.secrets.encryptionKey | quote }}
  DATABASE_URL: {{ include "datametl.databaseUrl" . | quote }}
  REDIS_URL: {{ include "datametl.redisUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  {{- if .Values.oauth2Proxy.enabled }}
  OAUTH2_PROXY_CLIENT_SECRET: {{ required "oauth2Proxy.oidc.clientSecret is required" .Values.oauth2Proxy.oidc.clientSecret | quote }}
  OAUTH2_PROXY_COOKIE_SECRET: {{ required "oauth2Proxy.oidc.cookieSecret is required (generate with: openssl rand -base64 32)" .Values.oauth2Proxy.oidc.cookieSecret | quote }}
  {{- end }}
{{- end }}
