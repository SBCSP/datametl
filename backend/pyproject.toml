[project]
name = "datametl-backend"
version = "0.1.0"
description = "DataMETL backend — schema introspection, comparison, and migration mapping API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "arq>=0.26",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    "watchfiles>=0.24",
    "sqlparse>=0.5",
    "anthropic>=0.40",
    "pymysql>=1.1",
    "pymssql>=2.3",
    "croniter>=2.0",
    "httpx>=0.28",
    "stripe>=15.6.1",
    "fastmcp>=4.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "B008", "B905",
    "I001",
    "F401",
    "UP007", "UP017", "UP031", "UP035", "UP042",
    "SIM105", "SIM108", "SIM117",
    "RUF002", "RUF003", "RUF006", "RUF009", "RUF012", "RUF022", "RUF100",
    "E402",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "type-arg",
    "call-arg",
    "attr-defined",
    "union-attr",
    "unused-ignore",
    "arg-type",
    "assignment",
    "no-any-return",
]

[[tool.mypy.overrides]]
module = ["arq.*", "croniter.*", "stripe.*", "fastmcp.*", "mcp.*", "mcp_types.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
