name: datametl

services:
  app-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USER:-datametl}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-datametl}
      POSTGRES_DB: ${APP_DB_NAME:-datametl}
    ports:
      - "5433:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-datametl} -d ${APP_DB_NAME:-datametl}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3005}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-168}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATAMETL_LICENSE_DEV_BYPASS: ${DATAMETL_LICENSE_DEV_BYPASS:-false}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      # Vendor issuer only (Phase 2). Empty = webhook disabled; Community installs need none of these.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-price_1UDWhFLRy9hgB11RWQ9Xp9FJ}
      STRIPE_ISSUANCE_STORE_PATH: ${STRIPE_ISSUANCE_STORE_PATH:-}
      LICENSE_SIGNING_KEY: ${LICENSE_SIGNING_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8001:8000"
    volumes:
      - ../backend:/app
      - /app/.venv

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATAMETL_LICENSE_DEV_BYPASS: ${DATAMETL_LICENSE_DEV_BYPASS:-false}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    # `--watch /app/app` reloads the worker when Python files change. Requires watchfiles
    # (declared in backend/pyproject.toml).
    command: ["arq", "--watch", "/app/app", "app.jobs.worker.WorkerSettings"]
    volumes:
      - ../backend:/app
      - /app/.venv

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
      NEXT_PUBLIC_DATAMETL_PRO_URL: ${NEXT_PUBLIC_DATAMETL_PRO_URL:-}
    ports:
      - "3005:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  app-postgres-data:
  redis-data:
