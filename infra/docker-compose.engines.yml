name: datametl

# Optional test engines — not started by `make up`. Use:
#   make up-mysql
#   make up-mssql
#   make up-engines
#
# From the DataMETL UI (backend container), use compose hostnames + container ports:
#   engine-mysql:3306   engine-mssql:1433
# From the host: localhost:3307 / localhost:14333

services:
  engine-mysql:
    image: mysql:8.4
    profiles: ["mysql", "engines"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ENGINE_MYSQL_PASSWORD:-EngineMySQL_ChangeMe!}
      MYSQL_DATABASE: ${ENGINE_MYSQL_DATABASE:-testdb}
    ports:
      - "3307:3306"
    volumes:
      - engine-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${ENGINE_MYSQL_PASSWORD:-EngineMySQL_ChangeMe!}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  engine-mssql:
    # Developer edition — accepts EULA via env. Password must meet SQL Server complexity rules.
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["mssql", "engines"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${ENGINE_MSSQL_PASSWORD:-EngineMSSQL_ChangeMe1!}
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - engine-mssql-data:/var/opt/mssql
    # sqlcmd path differs across image tags; fall back to a TCP check if tools are absent.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" >/dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1 || (echo > /dev/tcp/127.0.0.1/1433)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

volumes:
  engine-mysql-data:
  engine-mssql-data:
